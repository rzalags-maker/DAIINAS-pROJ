[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daiinas"
version = "0.1.0"
description = "Simulation-only perpetual futures liquidity reversal research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["websockets==16.0"]
bitsgap = ["cryptography>=42,<47"]

[project.scripts]
daiinas = "daiinas.cli:main"

[tool.setuptools.packages.find]
include = ["daiinas*"]
