name: Bitsgap KuCoin Futures OBSERVE snapshot (manual, redacted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitsgap-futures-observe
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install crypto for signed read-only probe
        run: python -m pip install 'cryptography>=42,<47'
      - name: Focused offline regression before private key use
        run: |
          python -m unittest discover -s tests -p 'test_bitsgap_readonly.py' -q
          python -m unittest discover -s tests -p 'test_bitsgap_futures_observe.py' -q
          python -m unittest discover -s tests -p 'test_bitsgap_futures_stream.py' -q
      - name: Authenticated Futures observation (never prints private balances)
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        run: python -m daiinas.bitsgap_futures_cli
