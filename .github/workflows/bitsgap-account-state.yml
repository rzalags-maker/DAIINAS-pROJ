name: Bitsgap Futures account reconciliation (manual, redacted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitsgap-futures-observe
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing read-only dependencies
        run: python -m pip install 'cryptography>=42,<47' 'websockets==16.0'
      - name: Offline Bitsgap and account-state regression
        run: python -B -m unittest discover -s tests -p 'test_bitsgap*.py' -q
      - name: Bounded authenticated account observation (no private output or files)
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        run: >-
          python -B -m daiinas.bitsgap_account_state --observe --seconds 8
          --scope-ref actions-readonly-market-view
