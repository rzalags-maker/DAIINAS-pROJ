name: One-time bounded Bitsgap Futures WS observation
# Bounded validation after observed optional mes+value topic payload, no raw data

on:
  push:
    branches:
      - feature/bitsgap-futures-ws-null-diagnostics-20261101
    paths:
      - '.github/workflows/bitsgap-ws-once-20261101.yml'

permissions:
  contents: read

concurrency:
  group: bitsgap-futures-ws-once-20261101
  cancel-in-progress: false

jobs:
  authenticated-ws-observe:
    if: github.event.head_commit.message == 'Run one-time bounded Bitsgap Futures WebSocket observation'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install signed REST and WS client dependencies
        run: python -m pip install 'cryptography>=42,<47' 'websockets>=14,<17'
      - name: Run WS event/REST null synthetic safety tests
        run: |
          python -B -m unittest discover -s tests -p test_bitsgap_futures_stream.py -q
          python -B -m unittest discover -s tests -p test_bitsgap_futures_ws_probe.py -q
      - name: Bounded authenticated Futures WS account subscription test (redacted)
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        run: |
          echo 'BITSGAP_FUTURES_WS_SCOPE=balance,orders,positions,positions_settings'
          echo 'MODE=OBSERVE_ONLY'
          python -B -m daiinas.bitsgap_futures_ws_probe
