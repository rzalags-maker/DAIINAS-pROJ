name: Control Room browser acceptance
on:
  pull_request:
    paths:
      - daiinas/control_room.py
      - daiinas/intelligence.py
      - daiinas/market_intelligence.py
      - daiinas/moneyflow.py
      - scripts/verify_control_room_browser.mjs
      - .github/workflows/control-room-browser-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright-live-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local public/manual-only Control Room
        run: |
          python -m daiinas.control_room > control-room-server.log 2>&1 &
          echo $! > control-room-server.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ > /dev/null && exit 0
            sleep 1
          done
          cat control-room-server.log
          exit 1
      - name: Browser acceptance with live Binance and Kraken public data
        env:
          CONTROL_ROOM_ARTIFACTS: control-room-browser-artifacts
        run: node scripts/verify_control_room_browser.mjs
      - name: Upload screenshot and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-browser-acceptance
          path: |
            control-room-browser-artifacts
            control-room-server.log
          if-no-files-found: error
          retention-days: 14
