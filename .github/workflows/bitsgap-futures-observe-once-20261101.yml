name: One-time Bitsgap Futures OBSERVE authenticated snapshot
# Re-run after reviewed documented topic-value normalization (PR #21)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bitsgap-futures-observe-once-20261101.yml'

permissions:
  contents: read

concurrency:
  group: bitsgap-once-observe-20261101
  cancel-in-progress: false

jobs:
  one-time-account-read:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'One-time Bitsgap Futures OBSERVE smoke test (no orders)'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing Ed25519 dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify read-only adapter and OBSERVE security locally
        run: |
          python -m unittest discover -s tests -p test_bitsgap_readonly.py -q
          python -m unittest discover -s tests -p test_bitsgap_futures_observe.py -q
          python -m unittest discover -s tests -p test_bitsgap_futures_stream.py -q
      - name: Read Bitsgap Futures status via signed REST only (no private balances in logs)
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        run: |
          echo "ONE_TIME_OBSERVE=STARTED"
          python -B - <<'PY'
          import os
          import json
          from daiinas.bitsgap_readonly import _post
          from daiinas.bitsgap_futures_observe import BitsgapFuturesObserver
          from daiinas.bitsgap_readonly import BitsgapError
          safe = {
              'UNVERIFIED_MANUAL_SCHEMA', 'UNVERIFIED_ENUMS_SCHEMA',
              'UNVERIFIED_MANUAL_CAPABILITIES', 'UNVERIFIED_REST_CAPABILITY',
              'UNVERIFIED_FUTURES_ENUM', 'KUCOIN_FUTURES_ENUM_UNRESOLVED',
              'UNEXPECTED_RESPONSE_SHAPE', 'INVALID_RESPONSE',
              'UNVERIFIED_USDT_FUTURES_BALANCE', 'UNVERIFIED_FUTURES_BALANCE_SHAPE',
              'UNVERIFIED_ORDERS_SHAPE', 'UNVERIFIED_ORDERS_COUNT',
              'UNVERIFIED_POSITIONS_SHAPE', 'UNVERIFIED_POSITIONS_SETTINGS_SHAPE',
              'INCONSISTENT_POSITION_MODES', 'INCONSISTENT_MARGIN_MODES',
          }
          try:
              def shape_only_transport(url, body, headers):
                  # Do not log body, signature, headers, URLs, response content or account fields.
                  req_topic = json.loads(body).get('topic')
                  raw = _post(url, body, headers)
                  try:
                      obj = json.loads(raw)
                      flags = ','.join(x for x in ('data','ok','topic','value','error','mes')
                                       if isinstance(obj,dict) and x in obj)
                      print('SAFE_ENVELOPE=' + (req_topic if req_topic in ('manual','conf_enums','balance','orders','positions','positions_settings') else 'UNKNOWN')
                            + ';SHAPE=' + ('DICT' if isinstance(obj,dict) else 'LIST' if isinstance(obj,list) else 'NULL' if obj is None else 'STRING' if isinstance(obj,str) else 'OTHER')
                            + ';KNOWN_FIELDS=' + (flags or 'NONE')
                            + ';FIELD_COUNT=' + str(len(obj) if isinstance(obj,(dict,list)) else 0)
                            + ';EXTRA_KEY_NAMES=' + (','.join(sorted(
                                 k for k in obj
                                 if isinstance(k,str) and k not in ('data','ok','topic','value','error','mes')
                                 and 0 < len(k) <= 30 and k.replace('_','').isalnum()
                                 )) if isinstance(obj,dict) else 'NONE'))
                  except Exception:
                      print('SAFE_ENVELOPE=NON_JSON_OR_UNVERIFIED')
                  return raw
              client = BitsgapFuturesObserver(os.environ.get('BITSGAP_PRIVATE_KEY_PEM'),
                                              transport=shape_only_transport)
              client.discover()
              print('FUTURES_CATALOG=PASS')
          except BitsgapError as exc:
              category = exc.category
              if category.startswith('HTTP_') and len(category) == 8 and category[5:].isdigit():
                  safe.add(category)
              print('FUTURES_CATALOG=UNVERIFIED; REASON=' + (category if category in safe else 'OTHER_AUTH_OR_SCHEMA_FAILURE'))
              raise SystemExit(2)
          except Exception:
              print('FUTURES_CATALOG=UNVERIFIED; REASON=LOCAL_RUNTIME')
              raise SystemExit(2)
          try:
              snap = client.snapshot()
              print('FUTURES_ACCOUNT=' + snap.completeness)
              print('FUTURES_WALLET_FIELDS=OBSERVED_REDACTED')
              print('ORDER_ROUTING=DISABLED')
          except BitsgapError as exc:
              category = exc.category
              if category.startswith('HTTP_') and len(category) == 8 and category[5:].isdigit():
                  safe.add(category)
              print('FUTURES_ACCOUNT=UNVERIFIED; REASON=' + (category if category in safe else 'OTHER_AUTH_OR_SCHEMA_FAILURE'))
              raise SystemExit(2)
          except Exception:
              print('FUTURES_ACCOUNT=UNVERIFIED; REASON=LOCAL_RUNTIME')
              raise SystemExit(2)
          PY
