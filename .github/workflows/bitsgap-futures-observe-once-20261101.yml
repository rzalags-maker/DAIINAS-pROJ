name: One-time Bitsgap Futures OBSERVE authenticated snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bitsgap-futures-observe-once-20261101.yml'

permissions:
  contents: read

concurrency:
  group: bitsgap-once-observe-20261101
  cancel-in-progress: false

jobs:
  one-time-account-read:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'One-time Bitsgap Futures OBSERVE smoke test (no orders)'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing Ed25519 dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify read-only adapter and OBSERVE security locally
        run: |
          python -m unittest discover -s tests -p test_bitsgap_readonly.py -q
          python -m unittest discover -s tests -p test_bitsgap_futures_observe.py -q
          python -m unittest discover -s tests -p test_bitsgap_futures_stream.py -q
      - name: Read Bitsgap Futures status via signed REST only (no private balances in logs)
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        run: |
          echo "ONE_TIME_OBSERVE=STARTED"
          python -B -m daiinas.bitsgap_futures_cli
