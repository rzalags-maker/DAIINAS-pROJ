name: One-time AccountState live OBSERVE (no writes)

on:
  push:
    branches:
      - verification/account-state-live-observe-20261101
    paths:
      - .github/workflows/account-state-once-live-observe-20261101.yml

permissions:
  contents: read

concurrency:
  group: account-state-live-once-20261101
  cancel-in-progress: false

jobs:
  authenticated-account-state:
    if: github.ref == 'refs/heads/verification/account-state-live-observe-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install read-only dependencies
        run: python -m pip install 'cryptography>=42,<47' 'websockets==16.0'
      - name: Synthetic account-state and preview safety tests
        run: |
          python -B -m unittest discover -s tests -p 'test_bitsgap_account_state.py' -q
          python -B -m unittest discover -s tests -p 'test_bitsgap_capital_preview.py' -q
      - name: Authenticated bounded AccountState REST/WS observation, redacted
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import asyncio
          import os
          from daiinas.bitsgap_futures_observe import BitsgapFuturesObserver
          from daiinas.bitsgap_account_state import observe_bounded, BLOCKED
          from daiinas.bitsgap_readonly import BitsgapError
          from websockets.asyncio.client import connect

          try:
              observer = BitsgapFuturesObserver(os.environ.get("BITSGAP_PRIVATE_KEY_PEM"))
              observer.discover()
              def secure_connect(url):
                  return connect(url, open_timeout=5, close_timeout=2, max_size=65536,
                                 max_queue=16, ping_interval=20)
              # Isolate existing adapter validation vs new normalized AccountState.
              # Only fixed categories; never print actual enum values or payloads.
              from daiinas.bitsgap_account_state import AccountState
              from daiinas.bitsgap_readonly import BitsgapError
              try:
                  settings_value = observer.read("positions_settings")
                  try:
                      count, mode, margin = observer._positions(settings_value, settings=True)
                      print("SETTINGS_ADAPTER_VALIDATION=PASS")
                      print("SETTINGS_MODE_CLASS=" + ("ONE_WAY" if mode == "ONE_WAY" else "ONEWAY" if mode == "ONEWAY" else "HEDGE" if mode == "HEDGE" else "UNVERIFIED" if mode == "UNVERIFIED" else "OTHER"))
                      print("SETTINGS_MARGIN_CLASS=" + ("CROSS" if margin == "CROSS" else "ISOLATED" if margin == "ISOLATED" else "UNVERIFIED" if margin == "UNVERIFIED" else "OTHER"))
                  except BitsgapError:
                      print("SETTINGS_ADAPTER_VALIDATION=UNVERIFIED")
              except BitsgapError:
                  print("SETTINGS_SIGNED_READ=UNVERIFIED")
              state = asyncio.run(observe_bounded(
                  observer, secure_connect, seconds=8,
                  scope_ref="bounded-ci-verification-only", store=None))
              observed = state.records
              for topic in ("balance", "orders", "positions", "positions_settings"):
                  for source in ("REST", "WS"):
                      entry = observed.get((topic, source))
                      quality = entry.quality if entry else "UNVERIFIED"
                      print("ACCOUNT_TOPIC_" + topic.upper() + "_" + source + "=" + quality)
              print("ACCOUNT_STATE_VERSION_PRESENT=" + str(state.state_version > 0))
              print("EXCHANGE_MARKET_VERIFIED=" + str(type(state.market_id) is int))
              print("FINANCIAL_RECONCILIATION=NO")
              print("REAL_ORDER_ROUTING=DISABLED")
              preview = state.model_a_input()
              if preview["decision"] != BLOCKED or preview["funding_authorized"]:
                  print("READ_ONLY_SAFETY=FAILED")
                  raise SystemExit(3)
              print("READ_ONLY_SAFETY=PASS")
              # Success means only that real signed REST+WS balance observations
              # were recorded, not reconciled margin/positions/capital.
              both = all(observed.get(("balance", source)) is not None and
                         observed[("balance", source)].quality == "VALIDATED"
                         for source in ("REST", "WS"))
              print("SIGNED_BALANCE_OBSERVATION=" + ("PASS" if both else "UNVERIFIED"))
              raise SystemExit(0 if both else 2)
          except BitsgapError:
              print("ACCOUNT_STATE_LIVE=UNVERIFIED_SIGNED_READ_OR_WS")
              raise SystemExit(2)
          except Exception:
              print("ACCOUNT_STATE_LIVE=UNVERIFIED_LOCAL_RUNTIME")
              raise SystemExit(2)
          PY

      - name: Signed position-settings schema classification only (no values)
        env:
          BITSGAP_PRIVATE_KEY_PEM: ${{ secrets.BITSGAP_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          python -B - <<'PY'
          import os, time
          from daiinas.bitsgap_futures_observe import BitsgapFuturesObserver, safe_diagnostic_category
          from daiinas.bitsgap_readonly import BitsgapError
          from daiinas.bitsgap_account_state import AccountState
          try:
              client=BitsgapFuturesObserver(os.environ.get("BITSGAP_PRIVATE_KEY_PEM"))
              client.discover()
              start=int(time.time()*1000)
              value=client.read("positions_settings")
              print("SETTINGS_SIGNED_READ=RECEIVED")
              count, mode, margin=client._positions(value, settings=True)
              print("SETTINGS_LEGACY_PARSER=VALIDATED")
              print("SETTINGS_MODE_CANONICAL=" + str(mode in ("ONE_WAY","HEDGE","UNVERIFIED")))
              print("SETTINGS_MARGIN_CANONICAL=" + str(margin in ("CROSS","ISOLATED","UNVERIFIED")))
              state=AccountState(client,scope_ref="settings-diagnostic-no-private-output")
              receipt=int(time.time()*1000)
              category=state.ingest(topic="positions_settings",value=value,source="REST",
                   market_id=client._futures_em,started_ms=start,received_ms=receipt)
              print("SETTINGS_ACCOUNTSTATE_INGEST=" + category)
              print("SETTINGS_ACCOUNTSTATE_FIELDS_VALIDATED=" +
                    str(bool(state.records[("positions_settings","REST")].values)))
              print("ORDER_ROUTING=DISABLED")
          except BitsgapError as exc:
              print("SETTINGS_SIGNED_READ_OR_PARSER=" + safe_diagnostic_category(exc.category))
          except Exception:
              print("SETTINGS_DIAGNOSTIC=LOCAL_UNVERIFIED")
          PY
